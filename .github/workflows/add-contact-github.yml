name: Add GitHub contact link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-contact-github.yml'

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GitHub button to contact section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''           <a class="btn btn-ghost" href="https://www.linkedin.com/in/wajedul-haque-59056b291" target="_blank" rel="noopener noreferrer">LinkedIn</a>'''
          new = '''           <a class="btn btn-ghost" href="https://www.linkedin.com/in/wajedul-haque-59056b291" target="_blank" rel="noopener noreferrer">LinkedIn</a>\n           <a class="btn btn-ghost" href="https://github.com/wajedulhaque2" target="_blank" rel="noopener noreferrer">GitHub</a>'''
          if old not in text:
              raise SystemExit('Contact LinkedIn button not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add GitHub link to contact section"
          git push
