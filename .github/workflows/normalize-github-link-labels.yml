name: Normalize GitHub link labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-github-link-labels.yml'

permissions:
  contents: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change GitHub project labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = re.sub(
              r'(<a href="https://github\.com/[^"]+"[^>]*>)View Project &rarr;(</a>)',
              r'\1View GitHub &rarr;\2',
              text,
          )
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Standardize GitHub link labels"
          git push
