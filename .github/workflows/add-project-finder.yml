name: Add recruiter project finder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-project-finder.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add project finder UI and search logic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'id="project-finder"' in text:
              raise SystemExit('Project finder already exists')
          css = Path('.github/tmp/project-finder.css').read_text(encoding='utf-8')
          markup = Path('.github/tmp/project-finder.html').read_text(encoding='utf-8')
          logic = Path('.github/tmp/project-finder.js').read_text(encoding='utf-8')
          css_marker = '    /* ABOUT */'
          html_marker = '  <section id="about">'
          js_marker = '  // Theme toggle'
          if css_marker not in text or html_marker not in text or js_marker not in text:
              raise SystemExit('Portfolio insertion marker missing')
          text = text.replace(css_marker, css + '\n' + css_marker, 1)
          text = text.replace(html_marker, markup + '\n' + html_marker, 1)
          text = text.replace(js_marker, logic + js_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add recruiter project finder"
          git push
