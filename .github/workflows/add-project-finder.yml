name: Refine recruiter project finder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-project-finder.yml'

permissions:
  contents: write

jobs:
  refine-finder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine search matching and presets
        run: python .github/tmp/refine-project-finder.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine recruiter project finder"
          git push
