name: Standardise project badges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-project-badges.yml'

permissions:
  contents: write

jobs:
  standardise-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardise project badge labels
        run: python .github/tmp/standardize-project-badges.py
      - name: Commit badge standardisation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Standardise project card labels"
          git push
