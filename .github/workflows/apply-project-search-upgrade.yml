name: Apply Project Explorer upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-project-search-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Project Explorer upgrade
        run: python .github/tmp/apply-search-upgrade.py
      - name: Commit Project Explorer upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Project Explorer search"
          git push
